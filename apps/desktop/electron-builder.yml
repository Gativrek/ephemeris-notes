# Windows installer and portable exe (owner request, 2026-10-23).
# The app is fully bundled by electron-vite (out/), so no node_modules are packaged.
appId: ephemeris-notes
productName: Ephemeris
copyright: Copyright (c) 2026 Gabriel. MIT License.
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
npmRebuild: false
asar: true
win:
  # Rendered from design/assets/Logos by scripts/build-icons.mjs (pnpm icons).
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Ephemeris-Setup-${version}.${ext}
  # Per-user install: no administrator prompt.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ephemeris
  # The look of the app's chooser (build/installer.nsh; art from scripts/build-installer-art.mjs).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  uninstallDisplayName: Ephemeris
  # Uninstalling never touches the library: notes live in the folder the user chose.
  deleteAppDataOnUninstall: false
portable:
  artifactName: Ephemeris-${version}-portable.exe
